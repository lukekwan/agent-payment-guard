openapi: 3.1.0
info:
  title: SignGate - Agent Policy & Execution Control
  version: 2.0.0
  description: SignGate is Nomos Labs' agent policy and execution control product.
    It evaluates authority, mandates, approval requirements, signer boundaries,
    and evidence before autonomous agents buy, pay, call infrastructure, or
    trigger money movement. x402 is a supported protocol and commerce use case,
    not the product category.
  contact:
    email: hello@signgate.dev
  x-guidance: Use /v1/agentic-commerce/preflight for the unified decision
    contract. Treat x402, wallet-risk, RPC, chain-data, and buyer-identity
    endpoints as supported evidence providers and commerce surfaces, not as the
    whole SignGate product identity.
servers:
  - url: https://base-agent-preflight.bytoken2023.workers.dev
paths:
  /v1/x402/base/address-preflight:
    get:
      operationId: getBaseAddressPreflight
      summary: Inspect a Base address before an autonomous payment or contract
        interaction.
      security: []
      x-payment-protocol: x402
      x-pricing-version: x402-pricing-v1-20260720
      x-price-usdc: $0.075
      x-payment-info:
        pricing_version: x402-pricing-v1-20260720
        price:
          mode: fixed
          currency: USD
          amount: "0.075"
        protocols:
          - x402: {}
      responses:
        "200":
          description: Paid safety intelligence response
        "400":
          description: Invalid input
        "402":
          description: x402 payment required
        "502":
          description: Public data provider unavailable
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
            description: Base address to inspect before an autonomous payment.
