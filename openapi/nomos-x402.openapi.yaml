  /v1/agentic-commerce/preflight:
    post:
      operationId: evaluateAgenticCommercePreflight
      summary: Evaluate whether an autonomous agent action is authorized before
        payment or signer execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                buyer_id:
                  type: string
                agent_id:
                  type: string
                agent_role:
                  type: string
                action:
                  type: string
                  default: payment_execution
                product_category:
                  type: string
                  default: payment_execution
                amount_usdc:
                  type: string
                asset:
                  type: string
                  default: USDC
                chain:
                  type: string
                  default: base
                merchant_domain:
                  type: string
                merchant_wallet:
                  type: string
                mandate:
                  type: object
                merchant:
                  type: object
              required:
                - agent_role
                - product_category
                - amount_usdc
            example:
              buyer_id: buyer.acme
              agent_id: agent.finance.001
              agent_role: finance_agent
              action: payment_execution
              product_category: payment_execution
              amount_usdc: "0.25"
              asset: USDC
              chain: base
              merchant_domain: pay.vendor.example
              merchant_wallet: "0xabc0000000000000000000000000000000000001"
              mandate:
                id: mandate-001
                type: payment
                status: active
                buyer_id: buyer.acme
                agent_id: agent.finance.001
                agent_role: finance_agent
                merchant_domains:
                  - pay.vendor.example
                merchant_wallets:
                  - "0xabc0000000000000000000000000000000000001"
                allowed_categories:
                  - payment_execution
                max_amount_usdc: "1.00"
                assets:
                  - USDC
                chains:
                  - base
                expires_at: 2099-01-01T00:00:00.000Z
              merchant:
                domain: pay.vendor.example
                wallet: "0xabc0000000000000000000000000000000000001"
                expected_wallet: "0xabc0000000000000000000000000000000000001"
                openapi_domain: pay.vendor.example
                agent_card_domain: pay.vendor.example
                category: payment_execution
                kyt_risk: low
      security: []
      responses:
        "200":
          description: ALLOW, REQUIRE_APPROVAL, or DENY decision with reason codes,
            evidence, and signer directive.
        "400":
          description: Invalid JSON body
