  /v1/x402/agent/action-preflight:
    get:
      operationId: getAgentActionPreflight
      summary: Return an AgentOps Guard ALLOW/REVIEW/BLOCK decision before a
        side-effecting agent action runs.
      security: []
      x-payment-protocol: x402
      x-pricing-version: x402-pricing-v1-20260720
      x-price-usdc: $0.010
      x-payment-info:
        pricing_version: x402-pricing-v1-20260720
        price:
          mode: fixed
          currency: USD
          amount: "0.010"
        protocols:
          - x402: {}
      responses:
        "200":
          description: Paid safety intelligence response
        "400":
          description: Invalid input
        "402":
          description: x402 payment required
        "502":
          description: Public data provider unavailable
      parameters:
        - name: action_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - tool_call
              - shell
              - deploy
              - dns
              - email
              - mcp_call
              - wallet
              - x402_purchase
              - file_write
              - browser
            description: Side-effecting action the agent wants to run.
        - name: target
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 500
            description: Human-readable target, command, endpoint, domain, or resource.
        - name: agent_id
          in: query
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9._:-]{1,128}$
            description: Caller-defined agent or principal id.
        - name: environment
          in: query
          required: false
          schema:
            type: string
            enum:
              - local
              - dev
              - staging
              - production
              - external
            description: Execution environment for the action.
        - name: risk_score
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9]{1,3}$
            description: Optional caller-supplied 0-100 risk score.
        - name: amount_usdc
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9]+(?:\.[0-9]{1,6})?$
            description: Optional payment, spend, or value at risk.
        - name: human_approval_ref
          in: query
          required: false
          schema:
            type: string
            maxLength: 160
            description: Human approval or ticket reference for elevated actions.
