[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-payment-guard"
version = "2.0.0"
description = "Python client for Agent Payment Guard"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["x402", "agent", "payment", "guard", "base", "usdc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://base-agent-preflight.bytoken2023.workers.dev/"
Repository = "https://github.com/lukekwan/agent-payment-guard"

[tool.setuptools]
py-modules = ["payment_guard"]
